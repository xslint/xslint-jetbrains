pluginGroup = com.xslint.jetbrains
pluginVersion = 0.0.0

# IntelliJ 2024.2 == build 242, which is LSP4IJ's own minimum. Community-safe.
pluginSinceBuild = 242
platformVersion = 2024.2

# LSP4IJ from the JetBrains Marketplace: <pluginId>:<version>
platformPlugins = com.redhat.devtools.lsp4ij:0.20.1

# The xslint-lsp npm version bundled into the plugin (bumped by the cascade).
xslintLspVersion = 0.0.6

# The platform provides the Kotlin stdlib; do not bundle our own.
kotlin.stdlib.default.dependency = false

org.gradle.caching = true
org.gradle.jvmargs = -Xmx4g -XX:MaxMetaspaceSize=768m
