---
docker:
  image: yegor256/rultor-image:latest
merge:
  script: |-
    ./gradlew build --stacktrace
release:
  pre: false
  script: |-
    [[ "${tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit -1
    ./gradlew build --stacktrace
